# L09 — three-member etcd (Raft) cluster for SYSDESIGN-09.
# Run with:  docker compose -p sd-09 up -d
# Host ports (localhost only): 10901, 10902, 10903 -> client port 2379 of etcd1..3.
# Image pinned to an explicit release tag (etcd v3.7.4, released 2026-11-18/19).

x-etcd: &etcd
  image: gcr.io/etcd-development/etcd:v3.7.4
  restart: "no"
  networks: [raft]
  healthcheck:
    test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
    interval: 2s
    timeout: 2s
    retries: 15

services:
  etcd1:
    <<: *etcd
    hostname: etcd1
    ports: ["127.0.0.1:10901:2379"]
    volumes: ["etcd1-data:/etcd-data"]
    command:
      - etcd
      - --name=etcd1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd1:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd1:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=sd-09-lab
      # Raft timing: these are etcd's defaults, written out so you can experiment.
      - --heartbeat-interval=100
      - --election-timeout=1000

  etcd2:
    <<: *etcd
    hostname: etcd2
    ports: ["127.0.0.1:10902:2379"]
    volumes: ["etcd2-data:/etcd-data"]
    command:
      - etcd
      - --name=etcd2
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd2:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd2:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=sd-09-lab
      - --heartbeat-interval=100
      - --election-timeout=1000

  etcd3:
    <<: *etcd
    hostname: etcd3
    ports: ["127.0.0.1:10903:2379"]
    volumes: ["etcd3-data:/etcd-data"]
    command:
      - etcd
      - --name=etcd3
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd3:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd3:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=sd-09-lab
      - --heartbeat-interval=100
      - --election-timeout=1000

networks:
  raft: {}

volumes:
  etcd1-data: {}
  etcd2-data: {}
  etcd3-data: {}
