# Lab L22 — continuous batching and prefix caching (CPU by default, GPU optional)
# Run:  docker compose -p sd-22 up -d                      (prefix caching on: the vLLM V1 default)
#       APC_FLAG=--no-enable-prefix-caching docker compose -p sd-22 up -d --force-recreate   (off)
# Server: http://localhost:12201
name: sd-22

services:
  vllm:
    image: vllm/vllm-openai-cpu:v0.34.0-x86_64
    command:
      - ${MODEL:-Qwen/Qwen2.5-0.5B-Instruct}
      # float32 because AVX2-only laptop CPUs lack fast BF16 matmuls; use bfloat16 on AVX-512 CPUs
      - --dtype=${DTYPE:-float32}
      - --max-model-len=${MAX_MODEL_LEN:-4096}
      - --max-num-seqs=${MAX_NUM_SEQS:-16}
      - --max-num-batched-tokens=${MAX_BATCHED_TOKENS:-2048}
      - --kv-cache-memory-bytes=${KV_BYTES:-2147483648}
      - ${APC_FLAG:---enable-prefix-caching}   # set APC_FLAG=--no-enable-prefix-caching to disable
      - --enforce-eager                     # skip torch.compile: much faster start-up on a laptop CPU
      - --port=8000
    environment:
      VLLM_CPU_OMP_THREADS_BIND: ${OMP_BIND:-auto}
      HF_HUB_DISABLE_TELEMETRY: "1"
      VLLM_NO_USAGE_STATS: "1"
      DO_NOT_TRACK: "1"
    ports:
      - "127.0.0.1:12201:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface
      - vllm-cache:/root/.cache/vllm
      - triton-cache:/root/.triton          # Triton-CPU kernels compiled on first use (slow once, then cached)
    cap_add: [SYS_NICE]
    security_opt: ["seccomp=unconfined"]
    shm_size: "2g"

volumes:
  hf-cache:
  vllm-cache:
  triton-cache:
