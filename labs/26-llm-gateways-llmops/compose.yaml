# Lab L26 — LLM gateway (SYSDESIGN-26)
# Run with:  docker compose -p sd-26 up -d
# Host ports (127.0.0.1 only): 12600 gateway (LiteLLM proxy), 12611 / 12612 the two model replicas (debug only).
name: sd-26

x-llamacpp: &llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server-b12464   # CPU build, OpenAI-compatible
  environment:
    LLAMA_CACHE: /models
  volumes:
    - models:/models
  command: ["--hf-repo", "Qwen/Qwen2.5-0.5B-Instruct-GGUF",
            "--hf-file", "qwen2.5-0.5b-instruct-q4_0.gguf",
            "--ctx-size", "4096", "--threads", "3", "--parallel", "2",
            "--host", "0.0.0.0", "--port", "8080"]
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
    interval: 5s
    timeout: 3s
    retries: 240

services:
  llm-a:
    <<: *llamacpp
    ports: ["127.0.0.1:12611:8080"]

  llm-b:
    <<: *llamacpp
    ports: ["127.0.0.1:12612:8080"]
    depends_on:
      llm-a:
        condition: service_healthy   # llm-a downloads the model into the shared volume first

  db:   # LiteLLM stores virtual keys, budgets and spend here
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm-lab-only     # local lab credential, not a secret
      POSTGRES_DB: litellm
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 3s
      timeout: 3s
      retries: 30

  gateway:
    # Pinned LTS tag. In production pin the image *digest* as well (see the lesson: March 2026 supply-chain advisory).
    image: docker.litellm.ai/berriai/litellm:v1.108.12-lts
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: sk-lab-master-0000          # lab-only admin key; never reuse
      DATABASE_URL: postgresql://litellm:litellm-lab-only@db:5432/litellm
      STORE_MODEL_IN_DB: "False"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    ports: ["127.0.0.1:12600:4000"]
    depends_on:
      db:
        condition: service_healthy
      llm-b:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 5s
      timeout: 5s
      retries: 60

volumes:
  models:
  pgdata:
