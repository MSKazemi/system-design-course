# Namespace, stable Deployment (v1) and Service for lab L14.
apiVersion: v1
kind: Namespace
metadata:
  name: lumen
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: lumen
  labels: {app: api, track: stable}
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: {app: api, track: stable}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1          # at most one extra pod during a rollout
      maxUnavailable: 0    # never drop below the desired count
  template:
    metadata:
      labels: {app: api, track: stable}
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: api
          image: lumen-api:v1
          imagePullPolicy: Never      # image is side-loaded with `kind load`
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          ports: [{containerPort: 8080, name: http}]
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 500m, memory: 128Mi}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 2
            failureThreshold: 1
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: lumen
spec:
  selector: {app: api}        # selects BOTH stable and canary tracks
  ports: [{port: 80, targetPort: http, name: http}]
