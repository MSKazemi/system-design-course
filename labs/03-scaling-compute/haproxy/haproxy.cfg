# Lab L03 — one HAProxy, five frontends, one balancing algorithm each.
# All five backends point at the same three replicas, so you can compare algorithms
# against identical servers without restarting anything.
global
    log stdout format raw local0 warning
    maxconn 20000

# Re-resolve backend names through Docker's embedded DNS. Without this, HAProxy resolves
# "app1".."app3" once at start-up. When a container is recreated it can get a new IP, and its old
# IP can be handed to a *different* container, so a server line silently points at the wrong replica.
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid      5s
    hold nx         5s
    hold obsolete   5s

defaults
    mode http
    log global
    option httplog
    timeout connect 1s
    timeout client  60s
    timeout server  60s
    # A health check must answer within 2 s. Without this, HAProxy uses "inter" (1 s) as the check
    # timeout, and a briefly overloaded host can make every server fail its check at once.
    timeout check   2s
    # Retry failed connection attempts, on another server ("redispatch 1" = on every retry). By
    # default HAProxy retries only new connection attempts, never a request that may already have
    # reached a server (the "retry-on" directive can widen this; we leave it at the default).
    retries "${RETRIES}"
    option redispatch 1
    # Active health check: GET /health every HC_INTER; down after 2 failures, up after 2 successes.
    option httpchk GET /health
    default-server check inter "${HC_INTER}" fall 2 rise 2 slowstart 5s resolvers docker init-addr last,libc,none

frontend stats
    bind :8404
    stats enable
    stats uri /
    stats refresh 2s
    http-request use-service prometheus-exporter if { path /metrics }

frontend fe_roundrobin
    bind :8080
    default_backend be_roundrobin
frontend fe_leastconn
    bind :8081
    default_backend be_leastconn
frontend fe_p2c
    bind :8082
    default_backend be_p2c
frontend fe_hash_consistent
    bind :8083
    default_backend be_hash_consistent
frontend fe_hash_mapbased
    bind :8084
    default_backend be_hash_mapbased

backend be_roundrobin
    balance roundrobin
    server app1 app1:8080
    server app2 app2:8080
    server app3 app3:8080

backend be_leastconn
    balance leastconn
    server app1 app1:8080
    server app2 app2:8080
    server app3 app3:8080

backend be_p2c
    # Power of two choices: pick two servers at random, send to the less loaded one.
    balance random(2)
    server app1 app1:8080
    server app2 app2:8080
    server app3 app3:8080

backend be_hash_consistent
    # Same ?key= always goes to the same server; removing a server moves only its keys.
    balance url_param key
    hash-type consistent
    server app1 app1:8080
    server app2 app2:8080
    server app3 app3:8080

backend be_hash_mapbased
    # hash(key) mod N: removing a server reshuffles most keys.
    balance url_param key
    hash-type map-based
    server app1 app1:8080
    server app2 app2:8080
    server app3 app3:8080
