# Lab L06 — Postgres primary + streaming replica. Run with:  docker compose -p sd-06 up -d --wait
# Host ports (localhost only): primary 10632, replica 10633.
name: sd-06

services:
  primary:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_PASSWORD: lab-only-password       # local lab credential, not a secret
      POSTGRES_DB: lumen
      REPLICATION_PASSWORD: lab-only-replication
    command: ["postgres",
              "-c", "wal_level=replica",
              "-c", "max_wal_senders=10",
              "-c", "max_replication_slots=10",
              "-c", "hot_standby=on"]
    volumes:
      - ./primary-init.sh:/docker-entrypoint-initdb.d/10-primary-init.sh:ro
      - primary-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:10632:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lumen"]
      interval: 2s
      timeout: 3s
      retries: 30

  replica:
    image: postgres:18.7-alpine
    user: postgres
    depends_on:
      primary: {condition: service_healthy}
    environment:
      REPLICATION_PASSWORD: lab-only-replication
    entrypoint: ["/bin/sh", "/replica-entrypoint.sh"]
    volumes:
      - ./replica-entrypoint.sh:/replica-entrypoint.sh:ro
      - replica-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:10633:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lumen"]
      interval: 2s
      timeout: 3s
      retries: 60

volumes:
  primary-data:
  replica-data:
